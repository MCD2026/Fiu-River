6.39],[85.342022,28.17271,38000,13.28],[85.341023,28.170517,38300,24.22],[85.339981,28.16836,38600,13.96],[85.338895,28.166245,38900,6.03],[85.337763,28.164178,39200,7.57]]};const status=document.getElementById('status');const viewer=new Cesium.Viewer('map',{animation:false,baseLayerPicker:false,geocoder:false,homeButton:false,timeline:false,infoBox:true,sceneModePicker:true,navigationHelpButton:true,fullscreenButton:true,baseLayer:false,terrainProvider:new Cesium.EllipsoidTerrainProvider()});viewer.scene.globe.depthTestAgainstTerrain=true;const esri=new Cesium.UrlTemplateImageryProvider({url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',credit:'Tiles © Esri',maximumLevel:17});viewer.imageryLayers.addImageryProvider(esri);let fails=0;esri.errorEvent.addEventListener(()=>{if(++fails<3)return;viewer.imageryLayers.removeAll();viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',credit:'© OpenStreetMap contributors',maximumLevel:19}));});const routePos=D.route.map(p=>Cesium.Cartesian3.fromDegrees(p[0],p[1],p[2]));const route=viewer.entities.add({name:'Modelled flood corridor',description:'72.64 km modelled corridor. This is a rapid screening route.',polyline:{positions:routePos,width:5,material:Cesium.Color.fromCssColorString('#bed731'),clampToGround:true}});const vel=D.vel.map((p,i)=>viewer.entities.add({name:`Velocity estimate — ${(p[2]/1000).toFixed(1)} km`,position:Cesium.Cartesian3.fromDegrees(p[0],p[1]),description:`<b>Estimate:</b> ${p[3]} m/s<br><b>Range:</b> ${p[4]}–${p[5]} m/s<br><b>Froude:</b> ${p[6]}`,point:{pixelSize:10,color:Cesium.Color.fromCssColorString('#10a86b'),outlineColor:Cesium.Color.WHITE,outlineWidth:2,heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,disableDepthTestDistance:3000}}));const high=D.stereo.map((p,i)=>viewer.entities.add({name:`High-water observation — ${(p[2]/1000).toFixed(1)} km`,position:Cesium.Cartesian3.fromDegrees(p[0],p[1]),description:`Stereo-derived height: <b>${p[3]} m</b><br>Not a surveyed mark.`,point:{pixelSize:9,color:Cesium.Color.fromCssColorString('#b44ee6'),outlineColor:Cesium.Color.WHITE,outlineWidth:2,heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,disableDepthTestDistance:3000}}));const sourceEntity=viewer.entities.add({name:'Collapse source',position:Cesium.Cartesian3.fromDegrees(85.51499,28.27088),description:'Observed source location from the rapid reconstruction.',point:{pixelSize:16,color:Cesium.Color.fromCssColorString('#ff5a36'),outlineColor:Cesium.Color.WHITE,outlineWidth:2,heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,disableDepthTestDistance:5000},label:{text:'Collapse source',font:'bold 13px Arial',fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,pixelOffset:new Cesium.Cartesian2(0,-24),heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,disableDepthTestDistance:5000}});const storageEntity=viewer.entities.add({name:'Conceptual 20 Mm³ storage footprint',position:Cesium.Cartesian3.fromDegrees(85.403462,28.302055),description:'50 m maximum-depth capacity scenario: 20 Mm³, 0.80 km², equivalent diameter about 1.01 km. This is not a detected lake.',ellipse:{semiMajorAxis:504.6,semiMinorAxis:504.6,material:Cesium.Color.fromCssColorString('#26d9c8').withAlpha(.4),outline:true,outlineColor:Cesium.Color.fromCssColorString('#26d9c8'),heightReference:Cesium.HeightReference.CLAMP_TO_GROUND}});function viewAll(t=1.4){viewer.camera.flyToBoundingSphere(Cesium.BoundingSphere.fromPoints(routePos),{duration:t,offset:new Cesium.HeadingPitchRange(Cesium.Math.toRadians(205),Cesium.Math.toRadians(-44),115000)})}viewAll(0);document.getElementById('home').onclick=()=>viewAll();document.getElementById('source').onclick=()=>viewer.flyTo(sourceEntity,{duration:1.4,offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-40),13000)});document.getElementById('storage').onclick=()=>viewer.flyTo(storageEntity,{duration:1.4,offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-40),11000)});document.getElementById('r').onchange=e=>route.show=e.target.checked;document.getElementById('v').onchange=e=>vel.forEach(x=>x.show=e.target.checked);document.getElementById('h').onchange=e=>high.forEach(x=>x.show=e.target.checked);document.getElementById('s').onchange=e=>storageEntity.show=e.target.checked;const cache=new Map();async function tile(z,x,y){const k=`${z}/${x}/${y}`;if(cache.has(k))return cache.get(k);const p=(async()=>{const r=await fetch(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${k}.png`);if(!r.ok)throw Error(r.status);const b=await createImageBitmap(await r.blob());const c=document.createElement('canvas');c.width=b.width;c.height=b.height;const q=c.getContext('2d',{willReadFrequently:true});q.drawImage(b,0,0);b.close();return{w:c.width,h:c.height,p:q.getImageData(0,0,c.width,c.height).data}})();cache.set(k,p);if(cache.size>160)cache.delete(cache.keys().next().value);return p}function zval(t,x,y){x=Math.max(0,Math.min(t.w-1,Math.round(x)));y=Math.max(0,Math.min(t.h-1,Math.round(y)));const o=(y*t.w+x)*4;return t.p[o]*256+t.p[o+1]+t.p[o+2]/256-32768}const terrain=new Cesium.CustomHeightmapTerrainProvider({width:65,height:65,tilingScheme:new Cesium.WebMercatorTilingScheme(),credit:'Elevation: Mapzen / AWS Open Data',callback:async(x,y,l)=>{const sl=Math.min(l,15),sc=2**(l-sl),sx=Math.floor(x/sc),sy=Math.floor(y/sc),ox=x-sx*sc,oy=y-sy*sc,t=await tile(sl,sx,sy),a=new Float32Array(4225);for(let r=0;r<65;r++)for(let c=0;c<65;c++)a[r*65+c]=zval(t,((ox+c/64)/sc)*(t.w-1),((oy+r/64)/sc)*(t.h-1));return a}});terrain.errorEvent.addEventListener(e=>{console.error(e);status.textContent='Satellite map active · terrain retrying';status.className='err'});viewer.terrainProvider=terrain;status.textContent='Satellite imagery and open 3D terrain active — no token required';status.className='ok';</script></body></html>
